  <script>
    /* Appearance, before first paint. Dark is the unthemed state, so this
       only ever ADDS data-theme="light". Same storage key as the app, so a
       grower's choice carries across the whole site. */
    (function () {
      try {
        var p = localStorage.getItem('growtoo:appearance') || 'dark';
        var light = p === 'light' ||
          (p === 'system' && !window.matchMedia('(prefers-color-scheme: dark)').matches);
        if (light) document.documentElement.setAttribute('data-theme', 'light');
      } catch (e) {}
    })();
  </script>
