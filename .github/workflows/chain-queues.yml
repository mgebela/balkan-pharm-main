name: Chain queues (mint · grow · market)

# Cloud-hosted settlement so listings/mints don't depend on a local laptop.
# Required repo secrets:
#   FIREBASE_SERVICE_ACCOUNT_JSON  — contents of chain/keys/firebase-service-account.json
#   SOLANA_AUTHORITY_KEY_JSON      — mint authority (keys/devnet-authority.json)
# Optional (role split — fall back to authority if unset):
#   SOLANA_ESCROW_KEY_JSON         — NFT escrow vault (keys/devnet-escrow.json)
#   SOLANA_FEE_PAYER_KEY_JSON      — market fee payer (keys/devnet-fee-payer.json)
#   SOLANA_RPC_URL                 — dedicated Devnet RPC (Helius/QuickNode)
on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

concurrency:
  group: chain-queues
  cancel-in-progress: false

jobs:
  queues:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: chain/package-lock.json

      - name: Install chain deps
        working-directory: chain
        run: npm ci

      - name: Write secrets
        working-directory: chain
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
          SOLANA_AUTHORITY_KEY_JSON: ${{ secrets.SOLANA_AUTHORITY_KEY_JSON }}
          SOLANA_ESCROW_KEY_JSON: ${{ secrets.SOLANA_ESCROW_KEY_JSON }}
          SOLANA_FEE_PAYER_KEY_JSON: ${{ secrets.SOLANA_FEE_PAYER_KEY_JSON }}
          SOLANA_RPC_URL: ${{ secrets.SOLANA_RPC_URL }}
        run: |
          set -euo pipefail
          if [ -z "${FIREBASE_SERVICE_ACCOUNT_JSON:-}" ] || [ -z "${SOLANA_AUTHORITY_KEY_JSON:-}" ]; then
            echo "::error::Missing FIREBASE_SERVICE_ACCOUNT_JSON or SOLANA_AUTHORITY_KEY_JSON secrets."
            echo "Add both under Repo → Settings → Secrets and variables → Actions."
            exit 1
          fi
          mkdir -p keys
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT_JSON" > keys/firebase-service-account.json
          printf '%s' "$SOLANA_AUTHORITY_KEY_JSON" > keys/devnet-authority.json
          if [ -n "${SOLANA_ESCROW_KEY_JSON:-}" ]; then
            printf '%s' "$SOLANA_ESCROW_KEY_JSON" > keys/devnet-escrow.json
          else
            cp keys/devnet-authority.json keys/devnet-escrow.json
            echo "::warning::SOLANA_ESCROW_KEY_JSON unset — using mint authority as escrow."
          fi
          if [ -n "${SOLANA_FEE_PAYER_KEY_JSON:-}" ]; then
            printf '%s' "$SOLANA_FEE_PAYER_KEY_JSON" > keys/devnet-fee-payer.json
          else
            cp keys/devnet-authority.json keys/devnet-fee-payer.json
            echo "::warning::SOLANA_FEE_PAYER_KEY_JSON unset — using mint authority as fee payer."
          fi
          python3 - <<'PY'
          import json
          for path in (
              'keys/firebase-service-account.json',
              'keys/devnet-authority.json',
              'keys/devnet-escrow.json',
              'keys/devnet-fee-payer.json',
          ):
              json.load(open(path))
              print('ok', path)
          PY
          if [ -z "${SOLANA_RPC_URL:-}" ]; then
            echo "::warning::SOLANA_RPC_URL secret is empty — public Devnet RPC will 429 under load."
          fi

      - name: Run mint queue
        working-directory: chain
        env:
          SOLANA_RPC_URL: ${{ secrets.SOLANA_RPC_URL }}
          QUEUE_WORKER_ID: github-actions
        run: npm run mint:queue

      - name: Run grow queue
        working-directory: chain
        env:
          SOLANA_RPC_URL: ${{ secrets.SOLANA_RPC_URL }}
          QUEUE_WORKER_ID: github-actions
        run: npm run grow:queue

      - name: Run market queue
        working-directory: chain
        env:
          SOLANA_RPC_URL: ${{ secrets.SOLANA_RPC_URL }}
          QUEUE_WORKER_ID: github-actions
        run: npm run market:queue

      - name: Scrub keys
        if: always()
        working-directory: chain
        run: rm -f keys/firebase-service-account.json keys/devnet-authority.json keys/devnet-escrow.json keys/devnet-fee-payer.json
