# Deploy firestore.rules whenever it changes on main.
# Uses the Firebase Rules API (not `firebase deploy`) so the CI service
# account does not need Service Usage Viewer.
#
# Required secret: FIREBASE_SERVICE_ACCOUNT_JSON
name: Deploy Firestore rules

on:
  push:
    branches: [main]
    paths:
      - 'firestore.rules'
      - 'scripts/deploy-firestore-rules.mjs'
      - '.github/workflows/deploy-firestore-rules.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-firestore-rules
  cancel-in-progress: true

jobs:
  deploy-rules:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Deploy rules via Rules API
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
          FIREBASE_PROJECT: balpha-9dab9
        run: |
          if [ -z "${FIREBASE_SERVICE_ACCOUNT_JSON:-}" ]; then
            echo "::error::Missing FIREBASE_SERVICE_ACCOUNT_JSON secret."
            exit 1
          fi
          node scripts/deploy-firestore-rules.mjs

      - name: Verify marketListings is not publicly readable
        run: |
          code=$(curl -sS -o /tmp/ml.json -w "%{http_code}" \
            "https://firestore.googleapis.com/v1/projects/balpha-9dab9/databases/(default)/documents/marketListings?pageSize=1")
          echo "marketListings HTTP $code"
          if [ "$code" != "403" ]; then
            echo "::error::Expected 403 for unauthenticated marketListings read, got $code"
            cat /tmp/ml.json
            exit 1
          fi
