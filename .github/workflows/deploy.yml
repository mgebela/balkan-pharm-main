name: Deploy to GitHub Pages

# Static mirror at https://mgebela.github.io/balkan-pharm-main/
# (growto.live is Netlify from main — independent of this workflow.)
#
# Pages backend sometimes parks a deploy in deployment_in_progress longer
# than the old single-job + 10m poll window, which cancels the deploy and
# leaves the mirror stale. Split build/deploy + a longer poll timeout.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Prepare static site
        run: |
          mkdir -p _site
          rsync -a \
            --exclude='.git' \
            --exclude='.github' \
            --exclude='functions' \
            --exclude='node_modules' \
            --exclude='docs' \
            --exclude='_site' \
            ./ _site/

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    # Allow Pages backend to finish after a slow queue (default poll is 10m).
    timeout-minutes: 25
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          # 20 minutes — GitHub has been slow to leave deployment_in_progress.
          timeout: 1200000
          error_count: 20
          reporting_interval: 10000
