<!DOCTYPE html>
<html lang="hr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Prijava | Balkan-pharm</title>
  <link rel="icon" type="image/png" href="../images/bp.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main class="auth-shell">
    <a href="/" class="brand">
      <img src="../images/bp.png" alt="Balkan-pharm" />
    </a>
    <section class="auth-card">
      <h1>Prijava u dnevnik</h1>
      <p class="lead">Za pristup stranici aplikacije potrebna je prijava.</p>
      <form id="auth-form" novalidate>
        <label for="email">Email</label>
        <input id="email" name="email" type="email" autocomplete="email" required />
        <label for="password">Lozinka</label>
        <input id="password" name="password" type="password" autocomplete="current-password" minlength="6" required />
        <button id="submit-btn" type="submit">Prijavi se</button>
      </form>
      <p id="message" class="message" role="status" aria-live="polite"></p>
      <button id="toggle-mode" class="link-btn" type="button">Nemate račun? Registrirajte se</button>
    </section>
  </main>

  <script type="module" src="auth.js"></script>
</body>
</html>
