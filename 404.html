  <style>
    :root {
      --bg: #0f1a12;
      --brass: #c9a55e;
      --brass-ink: #1a1408;
      --text: #f3efe6;
      --text-muted: rgba(184, 196, 176, 0.78);
      --border: rgba(201, 165, 94, 0.2);
      --font: 'Archivo', sans-serif;
      --font-display: 'Fraunces', serif;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; }
    body {
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 1.5rem;
      font-family: var(--font);
      color: var(--text);
      background:
        radial-gradient(900px 480px at 85% -5%, rgba(201, 165, 94, 0.08) 0%, transparent 55%),
        radial-gradient(700px 420px at 8% 45%, rgba(40, 80, 50, 0.18) 0%, transparent 50%),
        linear-gradient(180deg, #0c1610 0%, var(--bg) 40%, #101c14 100%);
    }
    .miss {
      width: min(100%, 26rem);
      text-align: center;
      padding: 1.75rem 1.35rem 1.5rem;
      border: 1px solid var(--border);
      border-radius: 12px;
      background: #132016;
    }
    .miss-mark {
      width: 56px;
      height: 56px;
      border-radius: 50%;
      box-shadow: 0 0 0 1px rgba(201, 165, 94, 0.4);
    }
    .miss-eyebrow {
      margin: 0.85rem 0 0.45rem;
      font-size: 0.68rem;
      font-weight: 650;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--brass);
    }
    h1 {
      margin: 0 0 0.55rem;
      font-family: var(--font-display);
      font-weight: 350;
      font-size: clamp(1.55rem, 4vw, 1.9rem);
      letter-spacing: -0.02em;
      line-height: 1.2;
    }
    p {
      margin: 0 0 1.25rem;
      color: var(--text-muted);
      line-height: 1.45;
      font-size: 0.95rem;
    }
    .miss-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 0.55rem;
      justify-content: center;
    }
    a {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 44px;
      padding: 0.65rem 1.15rem;
      border-radius: 4px;
      font-weight: 650;
      font-size: 0.92rem;
      text-decoration: none;
    }
    .btn-primary {
      background: var(--brass);
      color: var(--brass-ink);
      border: 1px solid var(--brass);
    }
    .btn-secondary {
      background: transparent;
      color: var(--text);
      border: 1px solid rgba(201, 165, 94, 0.55);
    }
  </style>
</head>
<body>
  <main class="miss">

    </div>
  </main>
</body>
