# growtoo static site (Netlify)
#
# Public grower journal:
#   https://growto.live/journal/          (path on apex)
#   https://journal.growto.live/          (same pages; add this hostname in Netlify Domain management)
#
# Host rewrites below map the subdomain onto /journal/* while keeping shared
# /styles, /images, and apex /js available. force (200!) is required because
# the site root already has index.html (marketing), which would otherwise win.

[build]
  publish = "."
  command = "echo 'Static site — no build step'"
  # Never auto-skip: Netlify had been marking every main push as Skipped.
  # exit 1 = "do not ignore" (continue the build).
  ignore = "exit 1"

# ── journal.growto.live → public journal mini-site ───────────
# More specific asset proxies first, then catch-all into /journal/.
[[redirects]]
  from = "https://journal.growto.live/styles/*"
  to = "/styles/:splat"
  status = 200
  force = true

[[redirects]]
  from = "https://journal.growto.live/images/*"
  to = "/images/:splat"
  status = 200
  force = true

[[redirects]]
  from = "https://journal.growto.live/js/*"
  to = "/js/:splat"
  status = 200
  force = true

[[redirects]]
  from = "https://journal.growto.live/journal/*"
  to = "/journal/:splat"
  status = 200
  force = true

[[redirects]]
  from = "https://journal.growto.live/*"
  to = "/journal/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/*"
  to = "/404.html"
  status = 404

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(self), microphone=(self), geolocation=(), payment=()"
    # Clickjacking + baseline; full script/connect CSP deferred (wallet inject + Firebase).
    Content-Security-Policy = "frame-ancestors 'none'; base-uri 'self'; object-src 'none'"

[[headers]]
  for = "/app/js/*"
  [headers.values]
    Cache-Control = "public, max-age=300, must-revalidate"

[[headers]]
  for = "/app/styles/*"
  [headers.values]
    Cache-Control = "public, max-age=300, must-revalidate"

[[headers]]
  for = "/app/index.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/journal/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
