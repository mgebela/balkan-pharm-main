# growtoo static site (Netlify)
[build]
  publish = "."
  command = "echo 'Static site — no build step'"
  # Never auto-skip: Netlify had been marking every main push as Skipped.
  # exit 1 = "do not ignore" (continue the build).
  ignore = "exit 1"

[[redirects]]
  from = "/*"
  to = "/404.html"
  status = 404

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=()"
    # Clickjacking + baseline; full script/connect CSP deferred (wallet inject + Firebase).
    Content-Security-Policy = "frame-ancestors 'none'; base-uri 'self'; object-src 'none'"

[[headers]]
  for = "/app/js/*"
  [headers.values]
    Cache-Control = "public, max-age=300, must-revalidate"

[[headers]]
  for = "/app/styles/*"
  [headers.values]
    Cache-Control = "public, max-age=300, must-revalidate"

[[headers]]
  for = "/app/index.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
