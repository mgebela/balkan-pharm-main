# growtoo static site (Netlify)
[build]
  publish = "."
  command = "echo 'Static site — no build step'"

[[headers]]
  for = "/app/js/*"
  [headers.values]
    Cache-Control = "public, max-age=300, must-revalidate"

[[headers]]
  for = "/app/styles/*"
  [headers.values]
    Cache-Control = "public, max-age=300, must-revalidate"

[[headers]]
  for = "/app/index.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
