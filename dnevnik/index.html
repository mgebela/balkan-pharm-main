<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sign in – dnevnik.live</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700;800&family=Lora:ital,wght@0,400;0,500;0,600;1,500;1,600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #e4d9c2;
      --bg-alt: #dccfaf;
      --surface: rgba(31, 26, 15, 0.05);
      --text: rgba(31, 46, 34, 0.92);
      --text-muted: rgba(31, 46, 34, 0.62);
      --accent: #8e3520;
      --accent-bright: #b4472b;
      --border: rgba(31, 46, 34, 0.18);
      --grower: #2f5d3a;
      --adopter: #8e3520;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 1rem;
      font-family: 'Archivo', sans-serif;
      background: radial-gradient(900px 500px at 50% -10%, rgba(180,71,43,0.1), transparent), var(--bg);
      color: var(--text);
    }
    .login-card {
      width: 100%;
      max-width: 460px;
      background: var(--bg-alt);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 1.25rem;
      box-shadow: 0 8px 24px rgba(31, 20, 10, 0.12);
    }
    h1 {
      margin: 0 0 0.35rem;
      font-size: 1.25rem;
      text-align: center;
    }
    .lead {
      margin: 0 0 1rem;
      color: var(--text-muted);
      text-align: center;
      font-size: 0.92rem;
    }
    .auth-tabs {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 0.35rem;
      margin-bottom: 1rem;
      padding: 0.25rem;
      border-radius: 6px;
      background: rgba(31, 46, 34, 0.06);
    }
    .auth-tab {
      border: 0;
      border-radius: 4px;
      padding: 0.55rem 0.5rem;
      font: inherit;
      font-weight: 600;
      font-size: 0.88rem;
      color: var(--text-muted);
      background: transparent;
      cursor: pointer;
    }
    .auth-tab.is-active {
      color: var(--text);
      background: var(--bg);
      box-shadow: 0 1px 3px rgba(31, 20, 10, 0.1);
    }
    .profile-pick {
      display: grid;
      gap: 0.55rem;
      margin-bottom: 1rem;
    }
    .profile-pick[hidden] { display: none !important; }
    .profile-option {
      display: grid;
      gap: 0.2rem;
      text-align: left;
      padding: 0.75rem 0.85rem;
      border-radius: 6px;
      border: 1.5px solid var(--border);
      background: var(--bg);
      color: var(--text);
      font: inherit;
      cursor: pointer;
      transition: border-color 0.15s, background 0.15s;
    }
    .profile-option strong {
      font-size: 0.95rem;
    }
    .profile-option span {
      font-size: 0.8rem;
      color: var(--text-muted);
      line-height: 1.35;
    }
    .profile-option.is-selected[data-type="grower"] {
      border-color: var(--grower);
      background: rgba(47, 93, 58, 0.1);
    }
    .profile-option.is-selected[data-type="adopter"] {
      border-color: var(--adopter);
      background: rgba(142, 53, 32, 0.1);
    }
    label {
      display: block;
      font-size: 0.9rem;
      margin-bottom: 0.35rem;
    }
    input {
      width: 100%;
      margin-bottom: 0.85rem;
      padding: 0.65rem 0.75rem;
      border-radius: 4px;
      border: 1px solid var(--border);
      background: var(--bg);
      color: var(--text);
      font-family: inherit;
    }
    input:focus {
      outline: none;
      border-color: var(--accent);
    }
    button[type="submit"] {
      width: 100%;
      border: 0;
      border-radius: 4px;
      padding: 0.7rem 0.9rem;
      font-weight: 700;
      color: #f7eee1;
      background: linear-gradient(90deg, var(--accent), var(--accent-bright));
      cursor: pointer;
    }
    button[type="submit"]:disabled {
      opacity: 0.65;
      cursor: wait;
    }
    .back-link {
      margin-top: 0.85rem;
      text-align: center;
      font-size: 0.9rem;
    }
    .back-link a { color: var(--accent-bright); text-decoration: none; }
    #login-status {
      margin-top: 0.75rem;
      font-size: 0.85rem;
      text-align: center;
      min-height: 1.2em;
    }
  </style>
</head>
<body>
  <form class="login-card" id="login-form">
    <h1 id="auth-title">Sign in to dnevnik.live</h1>
    <p class="lead" id="auth-lead">Choose how you use the app, then continue with email.</p>

    <div class="auth-tabs" role="tablist" aria-label="Auth mode">
      <button type="button" class="auth-tab is-active" id="tab-signin" data-mode="signin">Sign in</button>
      <button type="button" class="auth-tab" id="tab-signup" data-mode="signup">Create account</button>
    </div>

    <div class="profile-pick" id="profile-pick" hidden>
      <button type="button" class="profile-option" data-type="grower" id="pick-grower">
        <strong>Grower</strong>
        <span>Log stages, watering &amp; feeding in the journal. Tokenise your grow and unlock $GROW mints.</span>
      </button>
      <button type="button" class="profile-option" data-type="adopter" id="pick-adopter">
        <strong>Adopter</strong>
        <span>Adopt plant NFTs, track your garden &amp; $GROW, and trade on the market.</span>
      </button>
    </div>

    <label for="email">Email</label>
    <input id="email" type="email" required placeholder="you@email.com" autocomplete="email" />
    <label for="password">Password</label>
    <input id="password" type="password" required placeholder="••••••••" autocomplete="current-password" minlength="6" />
    <button type="submit" id="submit-btn">Sign in</button>
    <p id="login-status" aria-live="polite"></p>
    <div class="back-link"><a href="../index.html">← Back to home</a></div>
  </form>
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/12.16.0/firebase-app.js";
    import {
      getAuth,
      signInWithEmailAndPassword,
      createUserWithEmailAndPassword,
      onAuthStateChanged,
    } from "https://www.gstatic.com/firebasejs/12.16.0/firebase-auth.js";

    const firebaseConfig = {
      apiKey: "AIzaSyB-3wuIEOqpnnAqWiBYuSTEp1is_n76DEg",
      authDomain: "balpha-9dab9.firebaseapp.com",
      projectId: "balpha-9dab9",
      storageBucket: "balpha-9dab9.firebasestorage.app",
      messagingSenderId: "398537397385",
      appId: "1:398537397385:web:9bd3aec82f44ddec20e258",
      measurementId: "G-HLXHTQP41H"
    };

    const STORAGE_AUTH = 'dnevnik-live-auth';
    const STORAGE_PENDING_TYPE = 'dnevnik-live-pending-profile-type';

    const form = document.getElementById('login-form');
    const statusEl = document.getElementById('login-status');
    const submitBtn = document.getElementById('submit-btn');
    const profilePick = document.getElementById('profile-pick');
    const titleEl = document.getElementById('auth-title');
    const leadEl = document.getElementById('auth-lead');
    const tabSignin = document.getElementById('tab-signin');
    const tabSignup = document.getElementById('tab-signup');

    const params = new URLSearchParams(window.location.search);
    let mode = params.get('mode') === 'signup' ? 'signup' : 'signin';
    let profileType = params.get('type') === 'adopter' ? 'adopter' : params.get('type') === 'grower' ? 'grower' : '';

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);

    function setStatus(msg, isError = false) {
      statusEl.textContent = msg || '';
      statusEl.style.color = isError ? '#8e3520' : 'var(--text-muted)';
    }

    function syncProfileSelection() {
      document.querySelectorAll('.profile-option').forEach((btn) => {
        btn.classList.toggle('is-selected', btn.dataset.type === profileType);
      });
    }

    function setMode(next) {
      mode = next === 'signup' ? 'signup' : 'signin';
      tabSignin.classList.toggle('is-active', mode === 'signin');
      tabSignup.classList.toggle('is-active', mode === 'signup');
      profilePick.hidden = mode !== 'signup';
      if (mode === 'signup') {
        titleEl.textContent = 'Create your account';
        leadEl.textContent = 'Pick Grower or Adopter — each has its own app workspace.';
        submitBtn.textContent = 'Create account';
        document.getElementById('password').autocomplete = 'new-password';
        if (!profileType) profileType = 'grower';
      } else {
        titleEl.textContent = 'Sign in to dnevnik.live';
        leadEl.textContent = 'Welcome back. Your Grower or Adopter workspace opens automatically.';
        submitBtn.textContent = 'Sign in';
        document.getElementById('password').autocomplete = 'current-password';
      }
      syncProfileSelection();
      setStatus('');
    }

    tabSignin.addEventListener('click', () => setMode('signin'));
    tabSignup.addEventListener('click', () => setMode('signup'));
    document.querySelectorAll('.profile-option').forEach((btn) => {
      btn.addEventListener('click', () => {
        profileType = btn.dataset.type;
        syncProfileSelection();
      });
    });

    if (params.get('mode') === 'signup' || params.get('type')) {
      setMode('signup');
      if (params.get('type') === 'adopter' || params.get('type') === 'grower') {
        profileType = params.get('type');
      }
    } else {
      setMode('signin');
    }
    syncProfileSelection();

    onAuthStateChanged(auth, (user) => {
      if (user) {
        localStorage.setItem(
          STORAGE_AUTH,
          JSON.stringify({ email: user.email || '', uid: user.uid, loggedAt: Date.now() })
        );
        window.location.href = '../app/dnevnik/';
      }
    });

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;
      if (!email || !password) return;

      if (mode === 'signup' && profileType !== 'grower' && profileType !== 'adopter') {
        setStatus('Choose Grower or Adopter to continue.', true);
        return;
      }

      submitBtn.disabled = true;
      setStatus(mode === 'signup' ? 'Creating account…' : 'Signing in…');

      try {
        if (mode === 'signup') {
          localStorage.setItem(STORAGE_PENDING_TYPE, profileType);
          await createUserWithEmailAndPassword(auth, email, password);
          return;
        }
        localStorage.removeItem(STORAGE_PENDING_TYPE);
        await signInWithEmailAndPassword(auth, email, password);
      } catch (err) {
        const code = err && err.code;
        if (mode === 'signin' && code === 'auth/user-not-found') {
          setStatus('No account yet — switch to Create account.', true);
          setMode('signup');
        } else if (code === 'auth/email-already-in-use') {
          setStatus('Email already registered. Switch to Sign in.', true);
          setMode('signin');
        } else if (code === 'auth/wrong-password' || code === 'auth/invalid-credential') {
          setStatus('Wrong email or password.', true);
        } else if (code === 'auth/weak-password') {
          setStatus('Password must be at least 6 characters.', true);
        } else if (code === 'auth/invalid-email') {
          setStatus('Invalid email address.', true);
        } else {
          setStatus((mode === 'signup' ? 'Registration' : 'Sign-in') + ' failed. Please try again.', true);
        }
      } finally {
        submitBtn.disabled = false;
      }
    });
  </script>
</body>
</html>
