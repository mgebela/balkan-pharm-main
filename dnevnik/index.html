<!DOCTYPE html>
<html lang="hr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Prijava – Balkan-pharm dnevnik</title>
  <link rel="icon" type="image/png" href="../images/bp.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #071411;
      --bg-alt: #0b1f19;
      --surface: rgba(255, 255, 255, 0.06);
      --text: rgba(255, 255, 255, 0.94);
      --text-muted: rgba(255, 255, 255, 0.72);
      --accent: #0d9488;
      --accent-bright: #2dd4bf;
      --border: rgba(255, 255, 255, 0.14);
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 1rem;
      font-family: 'Plus Jakarta Sans', sans-serif;
      background: radial-gradient(900px 500px at 50% -10%, rgba(45,212,191,0.18), transparent), var(--bg);
      color: var(--text);
    }
    .login-card {
      width: 100%;
      max-width: 420px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 1.25rem;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.35);
    }
    .logo {
      height: 52px;
      display: block;
      margin: 0 auto 0.75rem;
    }
    h1 {
      margin: 0 0 0.5rem;
      font-size: 1.25rem;
      text-align: center;
    }
    p {
      margin: 0 0 1rem;
      color: var(--text-muted);
      text-align: center;
      font-size: 0.92rem;
    }
    label {
      display: block;
      font-size: 0.9rem;
      margin-bottom: 0.35rem;
    }
    input {
      width: 100%;
      margin-bottom: 0.85rem;
      padding: 0.65rem 0.75rem;
      border-radius: 10px;
      border: 1px solid var(--border);
      background: var(--bg-alt);
      color: var(--text);
      font-family: inherit;
    }
    input:focus {
      outline: none;
      border-color: var(--accent);
    }
    button {
      width: 100%;
      border: 0;
      border-radius: 10px;
      padding: 0.7rem 0.9rem;
      font-weight: 700;
      color: #06201a;
      background: linear-gradient(90deg, var(--accent), var(--accent-bright));
      cursor: pointer;
    }
    .auth-mode {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 0.45rem;
      margin-bottom: 1rem;
    }
    .mode-btn {
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 0.55rem 0.6rem;
      background: rgba(255, 255, 255, 0.02);
      color: var(--text);
      font-weight: 600;
      cursor: pointer;
    }
    .mode-btn.active {
      border-color: transparent;
      color: #06201a;
      background: linear-gradient(90deg, var(--accent), var(--accent-bright));
    }
    .auth-helper {
      margin-top: 0.65rem;
      font-size: 0.86rem;
      text-align: center;
      color: var(--text-muted);
      min-height: 1.2rem;
    }
    .auth-helper.error {
      color: #fca5a5;
    }
    .back-link {
      margin-top: 0.85rem;
      text-align: center;
      font-size: 0.9rem;
    }
    .back-link a { color: var(--accent-bright); text-decoration: none; }
  </style>
</head>
<body>
  <form class="login-card" id="login-form">
    <img class="logo" src="../images/bp.png" alt="Balkan-pharm" />
    <h1>Prijava u dnevnik</h1>
    <p id="auth-subtitle">Prijavite se da otvorite aplikaciju dnevnika uzgoja.</p>
    <div class="auth-mode" role="tablist" aria-label="Način prijave">
      <button type="button" class="mode-btn active" id="mode-signin" aria-selected="true">Prijava</button>
      <button type="button" class="mode-btn" id="mode-signup" aria-selected="false">Kreiraj račun</button>
    </div>
    <label for="email">E-mail</label>
    <input id="email" type="email" required placeholder="vas@email.com" />
    <label for="password">Lozinka</label>
    <input id="password" type="password" required placeholder="••••••••" />
    <button type="submit" id="auth-submit">Prijavi se</button>
    <div class="auth-helper" id="auth-helper"></div>
    <div class="back-link"><a href="../index.html">← Povratak na početnu</a></div>
  </form>
  <script>
    (function () {
      var form = document.getElementById('login-form');
      var subtitle = document.getElementById('auth-subtitle');
      var helper = document.getElementById('auth-helper');
      var submit = document.getElementById('auth-submit');
      var modeSignin = document.getElementById('mode-signin');
      var modeSignup = document.getElementById('mode-signup');
      var STORAGE_AUTH = 'balkan-pharm-auth';
      var STORAGE_USERS = 'balkan-pharm-users';
      var authMode = 'signin';

      function getUsers() {
        try {
          var data = localStorage.getItem(STORAGE_USERS);
          return data ? JSON.parse(data) : [];
        } catch (e) {
          return [];
        }
      }

      function setUsers(users) {
        localStorage.setItem(STORAGE_USERS, JSON.stringify(users));
      }

      function setMessage(message, isError) {
        helper.textContent = message || '';
        helper.classList.toggle('error', Boolean(isError));
      }

      function setMode(mode) {
        authMode = mode;
        var signinMode = mode === 'signin';
        modeSignin.classList.toggle('active', signinMode);
        modeSignin.setAttribute('aria-selected', signinMode ? 'true' : 'false');
        modeSignup.classList.toggle('active', !signinMode);
        modeSignup.setAttribute('aria-selected', signinMode ? 'false' : 'true');
        submit.textContent = signinMode ? 'Prijavi se' : 'Kreiraj račun';
        subtitle.textContent = signinMode
          ? 'Prijavite se da otvorite aplikaciju dnevnika uzgoja.'
          : 'Kreirajte račun pa se odmah prijavite.';
        setMessage('');
      }

      if (localStorage.getItem(STORAGE_AUTH)) {
        window.location.href = '../app/dnevnik/';
        return;
      }

      modeSignin.addEventListener('click', function () {
        setMode('signin');
      });

      modeSignup.addEventListener('click', function () {
        setMode('signup');
      });

      form.addEventListener('submit', function (e) {
        e.preventDefault();
        var email = document.getElementById('email').value.trim();
        var password = document.getElementById('password').value;
        if (!email || !password) return;
        var users = getUsers();
        var user = users.find(function (u) { return u.email === email; });

        if (authMode === 'signup') {
          if (user) {
            setMessage('Račun s tim e-mailom već postoji. Koristite Prijavu.', true);
            return;
          }
          users.push({ email: email, password: password, createdAt: Date.now() });
          setUsers(users);
        } else {
          if (!user || user.password !== password) {
            setMessage('Neispravan e-mail ili lozinka.', true);
            return;
          }
        }

        localStorage.setItem(STORAGE_AUTH, JSON.stringify({ email: email, loggedAt: Date.now() }));
        window.location.href = '../app/dnevnik/';
      });
    })();
  </script>
</body>
</html>
