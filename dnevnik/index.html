<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sign in · growtoo</title>
  <meta name="description" content="Sign in to growtoo — free grow journal for cannabis growers." />
  <link rel="canonical" href="https://growto.live/dnevnik/" />
  <meta name="robots" content="noindex, follow" />
  <meta property="og:title" content="Sign in · growtoo" />
  <meta property="og:description" content="Sign in to growtoo — free grow journal for cannabis growers." />
  <meta property="og:url" content="https://growto.live/dnevnik/" />
  <meta property="og:image" content="https://growto.live/images/3.jpg" />
  <meta name="twitter:card" content="summary_large_image" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700;800&family=Lora:ital,wght@0,400;0,500;0,600;1,500;1,600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <link rel="icon" href="../images/growtoo-logo.png?v=20260722b" type="image/png" />
  <link rel="stylesheet" href="../styles/trust-gates.css?v=20260729g" />
  <style>
    :root {
      --bg: #0a1410;
      --bg-alt: #0e1a14;
      --surface: rgba(180, 220, 180, 0.05);
      --text: rgba(232, 255, 233, 0.92);
      --text-muted: rgba(190, 220, 190, 0.62);
      --accent: #b4472b;
      --accent-bright: #d45a38;
      --border: rgba(140, 200, 140, 0.16);
      --grower: #7dff9c;
      --adopter: #d45a38;
      --desk-panel: linear-gradient(180deg, rgba(10, 28, 18, 0.94) 0%, rgba(8, 18, 12, 0.98) 100%);
    }
    * { box-sizing: border-box; }
    html {
      background-color: var(--bg);
    }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 1rem;
      font-family: 'Archivo', sans-serif;
      background:
        radial-gradient(900px 480px at 80% -10%, rgba(180, 71, 43, 0.14) 0%, transparent 55%),
        radial-gradient(700px 420px at 10% 40%, rgba(60, 140, 80, 0.12) 0%, transparent 50%),
        linear-gradient(180deg, #07110d 0%, var(--bg) 35%, #08140f 100%);
      color: var(--text);
    }
    .login-card {
      width: 100%;
      max-width: 480px;
      background: var(--desk-panel);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 1.35rem 1.25rem;
      box-shadow: 0 18px 48px rgba(0, 0, 0, 0.4);
    }
    .login-brand {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.55rem;
      margin-bottom: 0.85rem;
    }
    .login-brand img {
      width: 64px;
      height: 64px;
      border-radius: 50%;
      box-shadow: 0 0 0 1px rgba(47, 143, 78, 0.45);
    }
    h1 {
      margin: 0 0 0.35rem;
      font-size: 1.25rem;
      text-align: center;
      color: #f4fff4;
    }
    .lead {
      margin: 0 0 1rem;
      color: var(--text-muted);
      text-align: center;
      font-size: 0.92rem;
    }
    .auth-tabs {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 0.35rem;
      margin-bottom: 1rem;
      padding: 0.25rem;
      border-radius: 6px;
      background: rgba(0, 0, 0, 0.28);
      border: 1px solid var(--border);
    }
    .auth-tab {
      border: 0;
      border-radius: 4px;
      padding: 0.55rem 0.5rem;
      font: inherit;
      font-weight: 600;
      font-size: 0.88rem;
      color: var(--text-muted);
      background: transparent;
      cursor: pointer;
    }
    .auth-tab.is-active {
      color: #f4fff4;
      background: rgba(120, 200, 130, 0.12);
      box-shadow: inset 0 0 0 1px rgba(120, 220, 140, 0.25);
    }
    .profile-pick {
      display: grid;
      gap: 0.55rem;
      margin-bottom: 1rem;
    }
    .profile-pick[hidden],
    .signup-only[hidden],
    .role-fields[hidden] {
      display: none !important;
    }
    .profile-option {
      display: grid;
      gap: 0.2rem;
      text-align: left;
      padding: 0.75rem 0.85rem;
      border-radius: 8px;
      border: 1.5px solid var(--border);
      background: rgba(0, 12, 6, 0.45);
      color: var(--text);
      font: inherit;
      cursor: pointer;
      transition: border-color 0.15s, background 0.15s;
    }
    .profile-option strong { font-size: 0.95rem; }
    .profile-option span {
      font-size: 0.8rem;
      color: var(--text-muted);
      line-height: 1.35;
    }
    .profile-option.is-selected[data-type="grower"] {
      border-color: rgba(120, 220, 140, 0.45);
      background: rgba(40, 120, 60, 0.18);
    }
    .profile-option.is-selected[data-type="adopter"] {
      border-color: rgba(255, 160, 120, 0.4);
      background: rgba(180, 71, 43, 0.18);
    }
    .field-block { margin-bottom: 0.85rem; }
    label {
      display: block;
      font-size: 0.9rem;
      margin-bottom: 0.35rem;
      color: rgba(232, 255, 233, 0.88);
    }
    .field-hint {
      margin: -0.15rem 0 0.4rem;
      font-size: 0.75rem;
      color: var(--text-muted);
      line-height: 1.35;
    }
    input,
    select,
    textarea {
      width: 100%;
      margin-bottom: 0;
      padding: 0.65rem 0.75rem;
      border-radius: 6px;
      border: 1px solid var(--border);
      background: rgba(0, 12, 6, 0.55);
      color: var(--text);
      font-family: inherit;
      font-size: 0.92rem;
    }
    textarea {
      min-height: 4.2rem;
      resize: vertical;
    }
    input:focus,
    select:focus,
    textarea:focus {
      outline: none;
      border-color: #7dff9c;
    }
    .choice-grid {
      display: grid;
      gap: 0.4rem;
    }
    .choice-grid--3 {
      grid-template-columns: 1fr;
    }
    @media (min-width: 420px) {
      .choice-grid--3 { grid-template-columns: 1fr 1fr 1fr; }
    }
    .choice-option {
      display: grid;
      gap: 0.15rem;
      text-align: left;
      padding: 0.65rem 0.7rem;
      border-radius: 8px;
      border: 1px solid var(--border);
      background: rgba(0, 12, 6, 0.45);
      color: var(--text);
      font: inherit;
      cursor: pointer;
    }
    .choice-option strong {
      font-size: 0.84rem;
    }
    .choice-option span {
      font-size: 0.72rem;
      color: var(--text-muted);
      line-height: 1.3;
    }
    .choice-option.is-selected {
      border-color: rgba(120, 220, 140, 0.45);
      background: rgba(40, 120, 60, 0.18);
    }
    .choice-option.is-selected[data-intent] {
      border-color: rgba(255, 160, 120, 0.45);
      background: rgba(180, 71, 43, 0.16);
    }
    .check-row {
      display: flex;
      align-items: flex-start;
      gap: 0.55rem;
      margin: 0.35rem 0 0.85rem;
      font-size: 0.82rem;
      line-height: 1.4;
      color: var(--text-muted);
    }
    .check-row input {
      width: auto;
      margin: 0.15rem 0 0;
      flex-shrink: 0;
    }
    .check-row a { color: #b8ffc8; }
    button[type="submit"] {
      width: 100%;
      border: 1px solid rgba(255, 190, 160, 0.32);
      border-radius: 12px;
      padding: 0.75rem 1.35rem;
      min-height: 48px;
      font-weight: 650;
      font-size: 0.95rem;
      color: #f7eee1;
      background: #d45a38;
      box-shadow: none;
      cursor: pointer;
      transition: background-color 0.15s ease, border-color 0.15s ease;
    }
    button[type="submit"]:hover {
      background: #e06a4a;
    }
    button[type="submit"]:active {
      background: #b4472b;
    }
    button[type="submit"]:focus-visible {
      outline: 2px solid #e8c46a;
      outline-offset: 3px;
    }
    button[type="submit"].submit--grower {
      border-color: rgba(120, 220, 140, 0.4);
      color: #06201a;
      background: #9dffb0;
    }
    button[type="submit"].submit--grower:hover {
      background: #b8ffc8;
    }
    button[type="submit"].submit--grower:active {
      background: #7dff9c;
    }
    button[type="submit"].submit--grower:focus-visible {
      outline: 2px solid #9dffb0;
      outline-offset: 3px;
    }
    button[type="submit"].submit--adopter {
      border-color: rgba(255, 190, 160, 0.32);
      color: #f7eee1;
      background: #d45a38;
    }
    button[type="submit"].submit--adopter:hover {
      background: #e06a4a;
    }
    button[type="submit"]:disabled {
      opacity: 0.65;
      cursor: wait;
    }
    .auth-divider {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      margin: 0.85rem 0 0.75rem;
      color: var(--text-muted);
      font-size: 0.78rem;
      text-transform: uppercase;
      letter-spacing: 0.06em;
    }
    .auth-divider::before,
    .auth-divider::after {
      content: '';
      flex: 1;
      height: 1px;
      background: rgba(140, 200, 140, 0.16);
    }
    .btn-google {
      width: 100%;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 0.55rem;
      border: 1px solid rgba(140, 200, 140, 0.28);
      border-radius: 12px;
      padding: 0.75rem 1.35rem;
      min-height: 48px;
      font: inherit;
      font-weight: 650;
      font-size: 0.95rem;
      color: #f4fff4;
      background: transparent;
      box-shadow: none;
      cursor: pointer;
      transition: background-color 0.15s ease, border-color 0.15s ease;
    }
    .btn-google:hover {
      background: rgba(120, 200, 130, 0.1);
      border-color: rgba(157, 255, 176, 0.4);
    }
    .btn-google:focus-visible {
      outline: 2px solid #9dffb0;
      outline-offset: 3px;
    }
    .btn-google:disabled {
      opacity: 0.65;
      cursor: wait;
    }
    .btn-google svg {
      flex-shrink: 0;
    }
    .back-link {
      margin-top: 0.85rem;
      text-align: center;
      font-size: 0.9rem;
    }
    .back-link a { color: #b8ffc8; text-decoration: none; }
    #login-status {
      margin-top: 0.75rem;
      font-size: 0.85rem;
      text-align: center;
      min-height: 1.2em;
    }
    .role-fields {
      margin-top: 0.15rem;
      padding-top: 0.15rem;
      border-top: 1px solid rgba(140, 200, 140, 0.12);
    }
    .role-fields-title {
      margin: 0.75rem 0 0.65rem;
      font-size: 0.78rem;
      font-weight: 700;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      color: rgba(190, 220, 190, 0.7);
    }
  </style>
</head>
<body>
  <form class="login-card" id="login-form" novalidate>
    <div class="login-brand">
      <img src="../images/growtoo-logo.png?v=20260722b" alt="" width="64" height="64" />
    </div>
    <h1 id="auth-title">Sign in to growtoo</h1>
    <p class="lead" id="auth-lead">Welcome back. Your Grower or Adopter workspace opens automatically.</p>

    <div class="auth-tabs" role="tablist" aria-label="Auth mode">
      <button type="button" class="auth-tab is-active" id="tab-signin" data-mode="signin">Sign in</button>
      <button type="button" class="auth-tab" id="tab-signup" data-mode="signup">Create account</button>
    </div>

    <div class="profile-pick" id="profile-pick" hidden>
      <button type="button" class="profile-option" data-type="grower" id="pick-grower">
        <strong>Grower</strong>
        <span>Free journal first. Optional on-chain proof when you want it.</span>
      </button>
      <button type="button" class="profile-option" data-type="adopter" id="pick-adopter">
        <strong>Adopter</strong>
        <span>Follow a real plant’s trail. Crypto is optional until you invest.</span>
      </button>
    </div>

    <div class="field-block signup-only" id="field-display-name" hidden>
      <label for="display-name">Display name</label>
      <input id="display-name" type="text" maxlength="64" placeholder="How you appear in growtoo" autocomplete="nickname" />
    </div>

    <div class="field-block">
      <label for="email">Email</label>
      <input id="email" type="email" required placeholder="you@email.com" autocomplete="email" />
    </div>
    <div class="field-block">
      <label for="password">Password</label>
      <input id="password" type="password" required placeholder="••••••••" autocomplete="current-password" minlength="8" />
      <p class="field-hint signup-only" id="password-hint" hidden>At least 8 characters. Use a unique password you don’t reuse elsewhere.</p>
    </div>
    <div class="field-block signup-only" id="field-password-confirm" hidden>
      <label for="password-confirm">Confirm password</label>
      <input id="password-confirm" type="password" placeholder="••••••••" autocomplete="new-password" minlength="8" />
    </div>

    <div class="role-fields" id="signup-grower-fields" hidden>
      <p class="role-fields-title">Grower setup</p>
      <div class="field-block">
        <label>Grow setup</label>
        <p class="field-hint">Seeds plant defaults and coaching.</p>
        <div class="choice-grid choice-grid--3" id="grow-setup-choices" role="group" aria-label="Grow setup">
          <button type="button" class="choice-option is-selected" data-setup="indoor">
            <strong>Indoor</strong>
            <span>Tents &amp; rooms</span>
          </button>
          <button type="button" class="choice-option" data-setup="outdoor">
            <strong>Outdoor</strong>
            <span>Field &amp; garden</span>
          </button>
          <button type="button" class="choice-option" data-setup="mixed">
            <strong>Mixed</strong>
            <span>Both setups</span>
          </button>
        </div>
      </div>
      <div class="field-block">
        <label for="home-city">Home city</label>
        <p class="field-hint">Used for the Plants weather forecast.</p>
        <input id="home-city" type="text" maxlength="80" placeholder="e.g. Osijek" autocomplete="address-level2" />
      </div>
      <div class="field-block">
        <label for="grow-style-note">Grow style <span style="font-weight:500;color:var(--text-muted)">(optional)</span></label>
        <textarea id="grow-style-note" maxlength="240" placeholder="e.g. autoflowers, 4 tents"></textarea>
      </div>
    </div>

    <div class="role-fields" id="signup-adopter-fields" hidden>
      <p class="role-fields-title">Adopter setup</p>
      <div class="field-block">
        <label>Why you’re here</label>
        <div class="choice-grid" id="adopter-intent-choices" role="group" aria-label="Adopter intent">
          <button type="button" class="choice-option is-selected" data-intent="support_growers">
            <strong>Support growers</strong>
            <span>Follow a real plant’s care trail</span>
          </button>
          <button type="button" class="choice-option" data-intent="collect_garden">
            <strong>Collect a garden</strong>
            <span>Adopt plant tokens and watch stages</span>
          </button>
          <button type="button" class="choice-option" data-intent="earn_rewards">
            <strong>Learn the flow</strong>
            <span>Practice stakes on test assets (no real value)</span>
          </button>
        </div>
      </div>
      <label class="check-row signup-only">
        <input type="checkbox" id="accept-devnet" />
        <span>I understand this uses Solana’s public test network (Devnet) — assets have no monetary value.</span>
      </label>
    </div>

    <label class="check-row signup-only" id="field-accept-age" hidden>
      <input type="checkbox" id="accept-age" />
      <span>I confirm I am <strong>18 years of age or older</strong>.</span>
    </label>

    <label class="check-row signup-only" id="field-accept-terms" hidden>
      <input type="checkbox" id="accept-terms" />
      <span>
        I agree to the
        <a href="../terms/" target="_blank" rel="noopener noreferrer">Terms of Service</a>
        and
        <a href="../privacy/" target="_blank" rel="noopener noreferrer">Privacy Policy</a>.
      </span>
    </label>

    <button type="submit" id="submit-btn">Sign in</button>

    <div class="auth-divider" aria-hidden="true">or</div>
    <button type="button" class="btn-google" id="btn-google-auth">
      <svg width="18" height="18" viewBox="0 0 48 48" aria-hidden="true">
        <path fill="#FFC107" d="M43.6 20.5H42V20H24v8h11.3C33.7 32.7 29.3 36 24 36c-6.6 0-12-5.4-12-12s5.4-12 12-12c3 0 5.8 1.1 7.9 3l5.7-5.7C34.2 6.1 29.4 4 24 4 12.9 4 4 12.9 4 24s8.9 20 20 20 20-8.9 20-20c0-1.3-.1-2.5-.4-3.5z"/>
        <path fill="#FF3D00" d="M6.3 14.7l6.6 4.8C14.7 15.1 19 12 24 12c3 0 5.8 1.1 7.9 3l5.7-5.7C34.2 6.1 29.4 4 24 4 16.3 4 9.7 8.3 6.3 14.7z"/>
        <path fill="#4CAF50" d="M24 44c5.2 0 9.9-2 13.4-5.2l-6.2-5.2C29.2 35.2 26.7 36 24 36c-5.2 0-9.6-3.3-11.3-7.9l-6.5 5C9.6 39.6 16.3 44 24 44z"/>
        <path fill="#1976D2" d="M43.6 20.5H42V20H24v8h11.3c-1.1 3.2-3.5 5.7-6.5 7.1l.1.1 6.2 5.2C36.8 39.2 44 34 44 24c0-1.3-.1-2.5-.4-3.5z"/>
      </svg>
      <span id="google-auth-label">Continue with Google</span>
    </button>

    <p id="login-status" aria-live="polite"></p>
    <div class="back-link"><a href="../index.html">← Back to home</a></div>
  </form>
  <script src="../app/js/signup.js?v=20260729g"></script>
  <script src="../js/site-trust.js?v=20260729g"></script>
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/12.16.0/firebase-app.js";
    import {
      getAuth,
      signInWithEmailAndPassword,
      createUserWithEmailAndPassword,
      sendEmailVerification,
      signInWithPopup,
      GoogleAuthProvider,
      onAuthStateChanged,
    } from "https://www.gstatic.com/firebasejs/12.16.0/firebase-auth.js";
    import {
      getFirestore,
      doc,
      getDoc,
      setDoc,
      updateDoc,
    } from "https://www.gstatic.com/firebasejs/12.16.0/firebase-firestore.js";

    const Signup = window.GrowtooSignup;
    if (!Signup) {
      console.error('GrowtooSignup model missing');
    }

    const firebaseConfig = {
      apiKey: "AIzaSyB-3wuIEOqpnnAqWiBYuSTEp1is_n76DEg",
      authDomain: "balpha-9dab9.firebaseapp.com",
      projectId: "balpha-9dab9",
      storageBucket: "balpha-9dab9.firebasestorage.app",
      messagingSenderId: "398537397385",
      appId: "1:398537397385:web:9bd3aec82f44ddec20e258",
      measurementId: "G-HLXHTQP41H"
    };

    const form = document.getElementById('login-form');
    const statusEl = document.getElementById('login-status');
    const submitBtn = document.getElementById('submit-btn');
    const googleBtn = document.getElementById('btn-google-auth');
    const googleLabel = document.getElementById('google-auth-label');
    const profilePick = document.getElementById('profile-pick');
    const titleEl = document.getElementById('auth-title');
    const leadEl = document.getElementById('auth-lead');
    const tabSignin = document.getElementById('tab-signin');
    const tabSignup = document.getElementById('tab-signup');
    const growerFields = document.getElementById('signup-grower-fields');
    const adopterFields = document.getElementById('signup-adopter-fields');

    const params = new URLSearchParams(window.location.search);
    let mode = params.get('mode') === 'signup' ? 'signup' : 'signin';
    let profileType = params.get('type') === 'adopter' ? 'adopter' : params.get('type') === 'grower' ? 'grower' : '';
    let growSetup = 'indoor';
    let adopterIntent = 'support_growers';
    let authBusy = false;
    let profileWritePromise = null;

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);
    const googleProvider = new GoogleAuthProvider();
    googleProvider.setCustomParameters({ prompt: 'select_account' });

    function setStatus(msg, isError = false) {
      statusEl.textContent = msg || '';
      statusEl.style.color = isError ? '#fca5a5' : 'var(--text-muted)';
    }

    function setBusy(busy) {
      authBusy = !!busy;
      submitBtn.disabled = authBusy;
      googleBtn.disabled = authBusy;
    }

    function syncProfileSelection() {
      document.querySelectorAll('.profile-option').forEach((btn) => {
        btn.classList.toggle('is-selected', btn.dataset.type === profileType);
      });
    }

    function syncGrowSetup() {
      document.querySelectorAll('#grow-setup-choices .choice-option').forEach((btn) => {
        btn.classList.toggle('is-selected', btn.dataset.setup === growSetup);
      });
    }

    function syncAdopterIntent() {
      document.querySelectorAll('#adopter-intent-choices .choice-option').forEach((btn) => {
        btn.classList.toggle('is-selected', btn.dataset.intent === adopterIntent);
      });
    }

    function syncRoleFields() {
      const isSignup = mode === 'signup';
      document.querySelectorAll('.signup-only').forEach((el) => {
        el.hidden = !isSignup;
      });
      growerFields.hidden = !(isSignup && profileType === 'grower');
      adopterFields.hidden = !(isSignup && profileType === 'adopter');

      const confirm = document.getElementById('password-confirm');
      const terms = document.getElementById('accept-terms');
      const age = document.getElementById('accept-age');
      const pwHint = document.getElementById('password-hint');
      const devnet = document.getElementById('accept-devnet');
      const displayName = document.getElementById('display-name');
      const homeCity = document.getElementById('home-city');
      const password = document.getElementById('password');

      if (confirm) confirm.required = isSignup;
      if (terms) terms.required = isSignup;
      if (age) age.required = isSignup;
      if (pwHint) pwHint.hidden = !isSignup;
      if (displayName) displayName.required = isSignup;
      if (homeCity) homeCity.required = isSignup && profileType === 'grower';
      if (devnet) devnet.required = isSignup && profileType === 'adopter';
      if (password) password.minLength = isSignup ? 8 : 6;

      submitBtn.classList.remove('submit--grower', 'submit--adopter');
      if (isSignup && profileType === 'grower') {
        submitBtn.classList.add('submit--grower');
        submitBtn.textContent = 'Start your journal free';
        googleLabel.textContent = 'Sign up with Google';
        titleEl.textContent = 'Start your journal free';
        leadEl.textContent = 'Log watering, feeding, and stages. On-chain proof is optional — never required to start.';
      } else if (isSignup && profileType === 'adopter') {
        submitBtn.classList.add('submit--adopter');
        submitBtn.textContent = 'Enter as Adopter';
        googleLabel.textContent = 'Sign up with Google';
        titleEl.textContent = 'Enter as Adopter';
        leadEl.textContent = 'Follow a plant’s journal trail. Test-network stakes are optional and have no monetary value.';
      } else if (isSignup) {
        submitBtn.textContent = 'Create account';
        googleLabel.textContent = 'Sign up with Google';
        titleEl.textContent = 'Create your account';
        leadEl.textContent = 'Growers start with the journal. Adopters follow a plant. Pick your desk.';
      } else {
        submitBtn.textContent = 'Sign in';
        googleLabel.textContent = 'Continue with Google';
        titleEl.textContent = 'Sign in to growtoo';
        leadEl.textContent = 'Welcome back. Your Grower or Adopter workspace opens automatically.';
      }
    }

    function setMode(next) {
      mode = next === 'signup' ? 'signup' : 'signin';
      tabSignin.classList.toggle('is-active', mode === 'signin');
      tabSignup.classList.toggle('is-active', mode === 'signup');
      profilePick.hidden = mode !== 'signup';
      if (mode === 'signup') {
        document.getElementById('password').autocomplete = 'new-password';
        if (!profileType) profileType = 'grower';
      } else {
        document.getElementById('password').autocomplete = 'current-password';
      }
      syncProfileSelection();
      syncGrowSetup();
      syncAdopterIntent();
      syncRoleFields();
      setStatus('');
    }

    function collectSignupInput(authProvider) {
      return {
        profileType: profileType,
        displayName: document.getElementById('display-name').value.trim(),
        acceptedTerms: !!document.getElementById('accept-terms').checked,
        acceptedAge: !!document.getElementById('accept-age').checked,
        growSetup: growSetup,
        homeCity: document.getElementById('home-city').value.trim(),
        growStyleNote: document.getElementById('grow-style-note').value.trim(),
        adopterIntent: adopterIntent,
        acceptedDevnet: !!document.getElementById('accept-devnet').checked,
        authProvider: authProvider || 'email',
      };
    }

    async function writeWebsiteProfile(user) {
      if (!Signup || !user) return;
      const pending = Signup.readPending();
      const ref = doc(db, 'users', user.uid);
      const snap = await getDoc(ref);
      if (!snap.exists()) {
        const profile = Signup.buildUserProfileDoc(user, pending);
        await setDoc(ref, profile);
        Signup.applyLocalDefaults(pending);
        Signup.hydrateLocalFromUserDoc(profile);
        Signup.clearPending();
        return;
      }
      const data = snap.data() || {};
      const patch = { lastLoginAt: new Date().toISOString() };
      const existingType = Signup.normalizeProfileType(data.profileType);
      if (!existingType) {
        patch.profileType = Signup.normalizeProfileType(pending.profileType) || 'grower';
        Signup.applyPayloadToUserDoc(patch, pending, patch.profileType);
        Signup.applyLocalDefaults(pending);
      } else if (pending && pending.profileType) {
        Signup.applyPayloadToUserDoc(patch, pending, existingType, {
          onlyIfMissing: true,
          existing: data,
        });
        Signup.applyLocalDefaults(pending);
      }
      await updateDoc(ref, patch);
      Signup.clearPending();
      Signup.hydrateLocalFromUserDoc(Object.assign({}, data, patch));
    }

    function goToApp(user) {
      if (Signup) Signup.rememberAuthSession(user);
      else {
        localStorage.setItem(
          'dnevnik-live-auth',
          JSON.stringify({ email: user.email || '', uid: user.uid, loggedAt: Date.now() })
        );
      }
      window.location.href = '../app/dnevnik/';
    }

    tabSignin.addEventListener('click', () => setMode('signin'));
    tabSignup.addEventListener('click', () => setMode('signup'));
    document.querySelectorAll('.profile-option').forEach((btn) => {
      btn.addEventListener('click', () => {
        profileType = btn.dataset.type;
        syncProfileSelection();
        syncRoleFields();
      });
    });
    document.querySelectorAll('#grow-setup-choices .choice-option').forEach((btn) => {
      btn.addEventListener('click', () => {
        growSetup = btn.dataset.setup;
        syncGrowSetup();
      });
    });
    document.querySelectorAll('#adopter-intent-choices .choice-option').forEach((btn) => {
      btn.addEventListener('click', () => {
        adopterIntent = btn.dataset.intent;
        syncAdopterIntent();
      });
    });

    if (params.get('mode') === 'signup' || params.get('type')) {
      setMode('signup');
      if (params.get('type') === 'adopter' || params.get('type') === 'grower') {
        profileType = params.get('type');
      }
    } else {
      setMode('signin');
    }
    syncProfileSelection();
    syncGrowSetup();
    syncAdopterIntent();
    syncRoleFields();

    onAuthStateChanged(auth, async (user) => {
      if (!user || authBusy) return;
      try {
        if (profileWritePromise) await profileWritePromise;
        else await writeWebsiteProfile(user);
      } catch (err) {
        console.warn('profile write', err);
      }
      goToApp(user);
    });

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;
      if (!email || !password) {
        setStatus('Enter email and password.', true);
        return;
      }

      if (mode === 'signup') {
        const checked = Signup.validateSignup(collectSignupInput('email'));
        if (!checked.ok) {
          setStatus(checked.error, true);
          return;
        }
        if (password.length < 8) {
          setStatus('Password must be at least 8 characters.', true);
          return;
        }
        const confirm = document.getElementById('password-confirm').value;
        if (password !== confirm) {
          setStatus('Passwords do not match.', true);
          return;
        }
        Signup.savePending(checked.payload);
      } else if (Signup) {
        Signup.clearPending();
      }

      setBusy(true);
      setStatus(mode === 'signup' ? 'Creating account…' : 'Signing in…');

      try {
        if (mode === 'signup') {
          const cred = await createUserWithEmailAndPassword(auth, email, password);
          try {
            await sendEmailVerification(cred.user);
          } catch (verifyErr) {
            console.warn('email verification', verifyErr);
          }
          profileWritePromise = writeWebsiteProfile(cred.user);
          await profileWritePromise;
          setStatus('Account created. Check your email to verify — opening the app…');
          goToApp(cred.user);
          return;
        }
        const cred = await signInWithEmailAndPassword(auth, email, password);
        profileWritePromise = writeWebsiteProfile(cred.user);
        await profileWritePromise;
        goToApp(cred.user);
      } catch (err) {
        const code = err && err.code;
        if (mode === 'signin' && code === 'auth/user-not-found') {
          setStatus('No account yet. Switch to Create account.', true);
          setMode('signup');
        } else if (code === 'auth/email-already-in-use') {
          setStatus('Email already registered. Switch to Sign in or use Google.', true);
          setMode('signin');
        } else if (code === 'auth/wrong-password' || code === 'auth/invalid-credential') {
          setStatus('Wrong email or password.', true);
        } else if (code === 'auth/weak-password') {
          setStatus('Password must be at least 8 characters.', true);
        } else if (code === 'auth/invalid-email') {
          setStatus('Invalid email address.', true);
        } else if (code === 'auth/popup-closed-by-user') {
          setStatus('Google sign-in was cancelled.', true);
        } else {
          setStatus((mode === 'signup' ? 'Registration' : 'Sign-in') + ' failed. Please try again.', true);
        }
      } finally {
        setBusy(false);
        profileWritePromise = null;
      }
    });

    googleBtn.addEventListener('click', async () => {
      if (mode === 'signup') {
        const checked = Signup.validateSignup(collectSignupInput('google'));
        if (!checked.ok) {
          setStatus(checked.error, true);
          return;
        }
        Signup.savePending(checked.payload);
      } else if (Signup) {
        Signup.clearPending();
      }

      setBusy(true);
      setStatus(mode === 'signup' ? 'Opening Google signup…' : 'Opening Google…');
      try {
        const result = await signInWithPopup(auth, googleProvider);
        profileWritePromise = writeWebsiteProfile(result.user);
        await profileWritePromise;
        goToApp(result.user);
      } catch (err) {
        const code = err && err.code;
        if (code === 'auth/popup-closed-by-user' || code === 'auth/cancelled-popup-request') {
          setStatus('Google sign-in was cancelled.', true);
        } else if (code === 'auth/account-exists-with-different-credential') {
          setStatus('This email already uses password sign-in. Use email/password instead.', true);
        } else if (code === 'auth/unauthorized-domain') {
          setStatus('This domain is not authorized for Google sign-in in Firebase.', true);
        } else if (code === 'auth/operation-not-allowed') {
          setStatus('Enable Google sign-in in Firebase Authentication → Sign-in method.', true);
        } else {
          setStatus('Google sign-in failed. Please try again.', true);
          console.warn(err);
        }
      } finally {
        setBusy(false);
        profileWritePromise = null;
      }
    });
  </script>
</body>
</html>
