<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Admin – Users</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;650&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet" />
  <script>
    /* T() must exist before any app script runs, even if i18n.js fails to
       load — app/js/* calls it for every piece of copy. i18n.js replaces
       this stub with the real lookup. */
    window.T = function (key, en, vars) {
      return String(en).replace(/\{(\w+)\}/g, function (whole, name) {
        return vars && name in vars ? vars[name] : whole;
      });
    };
  </script>
  <script src="../js/i18n.js?v=a6db21df9a" data-i18n-ns="common,app"></script>
  <link rel="stylesheet" href="../styles/tokens.css?v=20260806t" />
  <link rel="stylesheet" href="styles/app.css?v=20260731c" />
  <link rel="stylesheet" href="../styles/i18n.css?v=20260817a" />
  <style>
    body {
      font-family: var(--font);
      background: var(--bg);
      color: var(--text);
      padding: 1.25rem 1.5rem 2.5rem;
      margin: 0;
      min-height: 100vh;
    }

    .admin-users-shell {
      max-width: 56rem;
      margin: 0 auto;
    }

    .admin-users-back {
      margin-bottom: 1rem;
    }

    h1 {
      margin: 0 0 0.35rem;
      font-size: 1.45rem;
      font-weight: 650;
      letter-spacing: -0.02em;
      color: #f4fff4;
    }

    .admin-users-lead {
      margin: 0 0 1.25rem;
      color: var(--text-muted);
      font-size: 0.95rem;
    }

    .toolbar {
      margin-bottom: 1rem;
      display: flex;
      gap: 0.65rem;
      flex-wrap: wrap;
    }

    .admin-users-table-wrap {
      border: 1px solid var(--border);
      border-radius: 14px;
      background: var(--metric-panel-bg);
      overflow: hidden;
      box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.03);
    }

    table {
      width: 100%;
      border-collapse: collapse;
      color: var(--text);
    }

    th,
    td {
      padding: 0.85rem 1rem;
      border-bottom: 1px solid var(--desk-line);
      text-align: left;
      vertical-align: middle;
    }

    th {
      background: rgba(6, 18, 12, 0.92);
      font-size: 0.72rem;
      font-weight: 650;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: rgba(247, 238, 225, 0.55);
    }

    tr:last-child td {
      border-bottom: 0;
    }

    tbody tr:hover td {
      background: rgba(180, 220, 180, 0.04);
    }

    .admin-users-email {
      font-weight: 550;
      color: #faf4ea;
    }

    .admin-users-role {
      display: inline-block;
      margin-left: 0.45rem;
      padding: 0.15rem 0.45rem;
      border-radius: 6px;
      border: 1px solid rgba(140, 200, 140, 0.28);
      background: rgba(140, 200, 140, 0.1);
      font-size: 0.72rem;
      font-family: var(--font-mono);
      color: var(--green-light);
    }

    td .btn {
      margin-right: 0.35rem;
      margin-bottom: 0.2rem;
    }

    .btn.add-btn,
    .btn.edit-btn,
    .btn.delete-btn,
    .btn.view-btn {
      /* keep admin.js class hooks; visual from .btn */
    }

    .btn.delete-btn {
      background: transparent;
      border-color: rgba(212, 90, 56, 0.45);
      color: #ffb4a0;
    }

    .btn.delete-btn:hover {
      background: rgba(212, 90, 56, 0.14);
      border-color: rgba(212, 90, 56, 0.65);
    }

    .btn.edit-btn {
      border-color: rgba(140, 200, 140, 0.35);
      color: var(--green-light);
      background: transparent;
    }

    .btn.edit-btn:hover {
      background: rgba(140, 200, 140, 0.1);
    }

    /* Modal — align with app desk theme (overrides generic app.css modal when needed) */
    #userModal.modal {
      z-index: 220;
    }

    #userModal .modal-content {
      background: var(--bg-alt);
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 1.25rem 1.35rem;
      width: min(100%, 22rem);
      max-height: none;
    }

    #userModal .modal-content h2,
    #userModal .modal-content h3 {
      margin: 0 0 0.85rem;
      font-size: 1.1rem;
    }

    #userModal .modal-content label {
      display: block;
      margin-bottom: 0.75rem;
      font-size: 0.85rem;
      color: var(--text-muted);
    }

    #userModal .modal-content input,
    #userModal .modal-content select {
      width: 100%;
      margin-top: 0.35rem;
      margin-bottom: 0;
      padding: 0.55rem 0.65rem;
      border-radius: 8px;
      border: 1px solid var(--border);
      background: rgba(6, 18, 12, 0.9);
      color: var(--text);
      font: inherit;
    }

    #userModal .modal-actions {
      display: flex;
      gap: 0.5rem;
      justify-content: flex-end;
      margin-top: 1rem;
    }
  </style>
</head>

<body data-page="users">

<div id="loading-screen" class="loading-screen">
  <div class="loader"></div>
  <p>Loading users...</p>
</div>

<div class="admin-users-shell">
  <button type="button" class="btn btn-ghost admin-users-back" onclick="history.back()">← Back</button>

  <h1>Users</h1>
  <p class="admin-users-lead">Manage account roles for the growtoo app.</p>

  <div class="toolbar">
    <button type="button" class="btn btn-primary add-btn" id="addUserBtn">Add user</button>
  </div>

  <div class="admin-users-table-wrap">
    <table>
      <thead>
        <tr>
          <th>Account</th>
          <th>Actions</th>
        </tr>
      </thead>
      <tbody id="usersTable"></tbody>
    </table>
  </div>
</div>

<div class="modal" id="userModal"></div>

<script src="../js/appcheck-config.js?v=20260819c"></script>
<script type="module" src="js/admin.js?v=20260818b"></script>

  <div class="lang-switch-floating"><div class="nav-lang" data-i18n-switcher></div></div>
</body>
</html>
