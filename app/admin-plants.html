<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Admin – Plants</title>
  <script>
    /* T() must exist before any app script runs, even if i18n.js fails to
       load — app/js/* calls it for every piece of copy. i18n.js replaces
       this stub with the real lookup. */
    window.T = function (key, en, vars) {
      return String(en).replace(/\{(\w+)\}/g, function (whole, name) {
        return vars && name in vars ? vars[name] : whole;
      });
    };
  </script>
  <script src="../js/i18n.js?v=a6db21df9a" data-i18n-ns="common,app"></script>
  <link rel="stylesheet" href="../styles/tokens.css?v=20260806t" />
  <link rel="stylesheet" href="styles/app.css" />
  <link rel="stylesheet" href="../styles/i18n.css?v=20260817a" />
  <style>
    body {
      font-family: Arial;
      background: var(--bg);
      color: var(--text);
      padding: 20px;
    }

    h1 { margin-bottom: 20px; }

    .toolbar { margin-bottom: 20px; }

    button {
      padding: 6px 10px;
      border: none;
      border-radius: 4px;
      cursor: pointer;
    }

    .add-btn { background: #22c55e; }
    .edit-btn { background: #3b82f6; }
    .delete-btn { background: #ef4444; }

    table {
      width: 100%;
      border-collapse: collapse;
      background: #1e293b;
      color: #e5e7eb;
    }

    th, td {
      padding: 10px;
      border-bottom: 1px solid #334155;
      text-align: left;
    }

    th { background: #0f172a; }

    .modal {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.6);
      display: none;
      align-items: center;
      justify-content: center;
    }

    .modal.open { display: flex; }

    .modal-content {
      background: #1e293b;
      color: #e5e7eb;
      padding: 20px;
      border-radius: 8px;
      width: 300px;
    }
  </style>
</head>

<body data-page="plants">
  <div id="loading-screen" class="loading-screen">
  <div class="loader"></div>
  <p>Loading plants...</p>
</div>
<button onclick="history.back()" style="margin-bottom:15px;">
  ⬅ Back
</button>
<h1>Admin – Plants</h1>

<div class="toolbar">
  <button class="add-btn" id="addUserBtn">➕ Add Entry</button>
</div>

<table>
  <thead>
    <tr>
      <th>Data</th>
      <th>Actions</th>
    </tr>
  </thead>
  <tbody id="usersTable"></tbody>
</table>

<div class="modal" id="userModal">
  <div class="modal-content">
    <h3>Add / Edit Plants</h3>
    <button id="saveUser">Save</button>
  </div>
</div>

<script src="../js/appcheck-config.js?v=20260803a"></script>
<script type="module" src="js/admin.js?v=20260817b"></script>
  <div class="lang-switch-floating"><div class="nav-lang" data-i18n-switcher></div></div>
</body>
</html>
