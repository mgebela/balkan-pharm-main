<!DOCTYPE html>
<script>



firebase.auth().onAuthStateChanged(async (user) => {
  if (!user) {
    window.location.href = "index.html";
    return;
  }

  const db = firebase.firestore();
  const userRef = db.collection("users").doc(user.uid);
  const snap = await userRef.get();

  if (!snap.exists) {
    window.location.href = "index.html";
    return;
  }

  const role = (function normalizeUserRole(r) {
    const v = String(r == null ? '' : r).trim().toLowerCase();
    if (!v) return 'user';
    if (v === 'supadmin' || v === 'super-admin' || v === 'super_admin') return 'superadmin';
    return v;
  })(snap.data().role);

  const email = String(user.email || '').trim().toLowerCase();
  const allowed =
    email === 'supadmin@dnevnik.live' || email === 'admin@dnevnik.live';

  if ((role !== 'admin' && role !== 'superadmin') || !allowed) {
    window.location.href = "index.html";
    return;
  }
});


</script>
